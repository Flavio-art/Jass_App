<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jass testen 🎴</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:linear-gradient(160deg,#1b7a3d,#0d3d20); color:#fff; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; text-align:center; }
  .logo { font-size:64px; margin-bottom:8px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.sub { opacity:.85; margin:0 0 28px; font-size:16px; }
  .btn { display:block; width:100%; padding:16px; margin:10px 0; border-radius:14px;
         font-size:17px; font-weight:600; text-decoration:none; color:#fff;
         background:rgba(255,255,255,.14); text-align:left; }
  .btn b { display:inline-block; width:26px; }
  .note { font-size:13px; opacity:.72; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎴</div>
  <h1>Jass testen</h1>
  <p class="sub">Hilf mit und teste die App (Android)</p>

  <a class="btn" href="https://groups.google.com/g/jass_app"><b>1</b> Tester-Gruppe beitreten</a>
  <a class="btn" href="https://play.google.com/apps/testing/com.jass.jass_app"><b>2</b> Tester werden &amp; App laden</a>

  <p class="note">Überall dasselbe Google-/Gmail-Konto verwenden.<br>Danke &amp; viel Spass beim Jassen! 🇨🇭</p>
</div>
</body>
</html>
