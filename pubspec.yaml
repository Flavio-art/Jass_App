name: jass_app
description: "Jass Kartenspiel App mit Französischen und Deutschen Karten"
publish_to: 'none'

version: 1.19.0+2016

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cards/french/
    - assets/cards/german/
    - assets/suit_icons/
    - assets/jass_nn_weights.json
